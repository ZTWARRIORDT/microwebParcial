version: '3.3'

services:
  consul:
    image: consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - ./consul/config.json:/consul/config/config.json
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0

  frontend:
    build: ./frontend
    ports:
      - "5000:5000"
    environment:
      - CONSUL_URL=consul:8500
      - SERVICE_NAME=frontend-service
    depends_on:
      - consul

  micro-users:
    build: ./microUsers
    ports:
      - "5001:5000"
    environment:
      - CONSUL_URL=consul:8500
      - SERVICE_NAME=users-service
    depends_on:
      - consul

  micro-products:
    build: ./microProducts
    ports:
      - "5002:5000"
    environment:
      - CONSUL_URL=consul:8500
      - SERVICE_NAME=products-service
    depends_on:
      - consul

  micro-orders:
    build: ./microOrders
    ports:
      - "5003:5000"
    environment:
      - CONSUL_URL=consul:8500
      - SERVICE_NAME=orders-service
    depends_on:
      - consul
      - micro-users
      - micro-products

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - micro-users
      - micro-products
      - micro-orders

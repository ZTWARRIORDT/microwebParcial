<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .card-header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #e6689a 0%, #e14e72 100%);
        }
        .product-card {
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
        }
        .stock-badge {
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="mb-0"><i class="fas fa-boxes me-2"></i>Gestión de Productos</h3>
                        <button class="btn btn-light" onclick="loadProducts()">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                    <div class="card-body">
                        <!-- Formulario para crear/editar productos -->
                        <form id="productForm" class="mb-4">
                            <input type="hidden" id="productId">
                            <div class="row">
                                <div class="col-md-3">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" id="name" class="form-control" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Precio</label>
                                    <input type="number" id="price" class="form-control" step="0.01" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Stock</label>
                                    <input type="number" id="stock" class="form-control" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Descripción</label>
                                    <input type="text" id="description" class="form-control">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">&nbsp;</label>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fas fa-save me-1"></i>Guardar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>

                        <!-- Grid de productos -->
                        <div class="row" id="productsGrid">
                            <!-- Los productos se cargarán aquí -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let products = [];

        // Cargar productos al iniciar
        document.addEventListener('DOMContentLoaded', loadProducts);

        // Form submit handler
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            saveProduct();
        });

        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                products = await response.json();
                renderProducts();
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            products.forEach(product => {
                const col = document.createElement('div');
                col.className = 'col-md-4 mb-3';
                
                col.innerHTML = `
                    <div class="card product-card h-100 shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="card-title">${product.name}</h5>
                                <span class="badge bg-${product.stock > 0 ? 'success' : 'danger'} stock-badge">
                                    ${product.stock} en stock
                                </span>
                            </div>
                            <p class="card-text text-muted small">${product.description || 'Sin descripción'}</p>
                            <h4 class="text-primary">$${product.price}</h4>
                        </div>
                        <div class="card-footer bg-transparent">
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-warning flex-fill" onclick="editProduct(${product.id})">
                                    <i class="fas fa-edit me-1"></i>Editar
                                </button>
                                <button class="btn btn-sm btn-danger flex-fill" onclick="deleteProduct(${product.id})">
                                    <i class="fas fa-trash me-1"></i>Eliminar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
        }

        async function saveProduct() {
            const productId = document.getElementById('productId').value;
            const name = document.getElementById('name').value;
            const price = parseFloat(document.getElementById('price').value);
            const stock = parseInt(document.getElementById('stock').value);
            const description = document.getElementById('description').value;

            const productData = { name, price, stock, description };

            try {
                let response;
                if (productId) {
                    response = await fetch(`/api/products/${productId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(productData)
                    });
                } else {
                    response = await fetch('/api/products', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(productData)
                    });
                }

                if (response.ok) {
                    resetForm();
                    loadProducts();
                }
            } catch (error) {
                console.error('Error saving product:', error);
            }
        }

        async function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (product) {
                document.getElementById('productId').value = product.id;
                document.getElementById('name').value = product.name;
                document.getElementById('price').value = product.price;
                document.getElementById('stock').value = product.stock;
                document.getElementById('description').value = product.description || '';
            }
        }

        async function deleteProduct(id) {
            if (confirm('¿Estás seguro de que quieres eliminar este producto?')) {
                try {
                    const response = await fetch(`/api/products/${id}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        loadProducts();
                    }
                } catch (error) {
                    console.error('Error deleting product:', error);
                }
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
        }
    </script>
</body>
</html>

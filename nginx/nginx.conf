events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:5000;
    }

    upstream users {
        server micro-users:5000;
    }

    upstream products {
        server micro-products:5000;
    }

    upstream orders {
        server micro-orders:5000;
    }

    server {
        listen 80;

        # ELIMINAR cualquier add_header Content-Security-Policy

        # Frontend principal
        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Servicio de usuarios
        location /users {
            proxy_pass http://users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/users {
            proxy_pass http://users/api/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Servicio de productos
        location /products {
            proxy_pass http://products/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/products {
            proxy_pass http://products/api/products;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Servicio de órdenes
        location /orders {
            proxy_pass http://orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/orders {
            proxy_pass http://orders/api/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health checks
        location /health {
            proxy_pass http://frontend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Órdenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .card-header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #3a8ee6 0%, #00d4ff 100%);
        }
        .order-card {
            border-left: 4px solid #4facfe;
        }
        .status-badge {
            font-size: 0.8rem;
        }
        .product-list {
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3 class="mb-0"><i class="fas fa-shopping-cart me-2"></i>Gestión de Órdenes</h3>
                        <div>
                            <button class="btn btn-light me-2" onclick="loadOrders()">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createOrderModal">
                                <i class="fas fa-plus me-1"></i>Nueva Orden
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- Lista de órdenes -->
                        <div class="row" id="ordersGrid">
                            <!-- Las órdenes se cargarán aquí -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para crear orden -->
    <div class="modal fade" id="createOrderModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Crear Nueva Orden</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Seleccionar Productos</label>
                            <select id="productSelect" class="form-select" onchange="addProductToOrder()">
                                <option value="">Seleccionar producto...</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Cantidad</label>
                            <input type="number" id="productQuantity" class="form-control" value="1" min="1">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">&nbsp;</label>
                            <button class="btn btn-primary w-100" onclick="addProductToOrder()">
                                <i class="fas fa-plus"></i> Agregar
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="orderItems">
                            </tbody>
                            <tfoot>
                                <tr class="table-primary">
                                    <td colspan="3" class="text-end"><strong>Total:</strong></td>
                                    <td colspan="2"><strong id="orderTotal">$0.00</strong></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="createOrder()">Crear Orden</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let orders = [];
        let products = [];
        let orderItems = [];
        let orderTotal = 0;

        // Cargar órdenes al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            loadOrders();
            loadProductsForOrder();
        });

        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                orders = await response.json();
                renderOrders();
            } catch (error) {
                console.error('Error loading orders:', error);
            }
        }

        async function loadProductsForOrder() {
            try {
                const response = await fetch('/api/products');
                products = await response.json();
                populateProductSelect();
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function populateProductSelect() {
            const select = document.getElementById('productSelect');
            select.innerHTML = '<option value="">Seleccionar producto...</option>';
            
            products.forEach(product => {
                if (product.stock > 0) {
                    const option = document.createElement('option');
                    option.value = product.id;
                    option.textContent = `${product.name} - $${product.price} (Stock: ${product.stock})`;
                    option.dataset.price = product.price;
                    select.appendChild(option);
                }
            });
        }

        function addProductToOrder() {
            const select = document.getElementById('productSelect');
            const quantityInput = document.getElementById('productQuantity');
            
            const productId = select.value;
            const quantity = parseInt(quantityInput.value);
            
            if (!productId || quantity <= 0) return;

            const selectedOption = select.options[select.selectedIndex];
            const productName = selectedOption.text.split(' - ')[0];
            const price = parseFloat(selectedOption.dataset.price);
            const subtotal = price * quantity;

            // Verificar si el producto ya está en la orden
            const existingItem = orderItems.find(item => item.product_id == productId);
            if (existingItem) {
                existingItem.quantity += quantity;
                existingItem.subtotal = existingItem.quantity * price;
            } else {
                orderItems.push({
                    product_id: parseInt(productId),
                    name: productName,
                    price: price,
                    quantity: quantity,
                    subtotal: subtotal
                });
            }

            updateOrderSummary();
            select.value = '';
            quantityInput.value = '1';
        }

        function removeOrderItem(index) {
            orderItems.splice(index, 1);
            updateOrderSummary();
        }

        function updateOrderSummary() {
            const tbody = document.getElementById('orderItems');
            tbody.innerHTML = '';
            
            orderTotal = 0;
            
            orderItems.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.name}</td>
                    <td>$${item.price}</td>
                    <td>${item.quantity}</td>
                    <td>$${item.subtotal}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="removeOrderItem(${index})">
                            <i class="fas fa-times"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
                orderTotal += item.subtotal;
            });
            
            document.getElementById('orderTotal').textContent = `$${orderTotal.toFixed(2)}`;
        }

        async function createOrder() {
            if (orderItems.length === 0) {
                alert('Debe agregar al menos un producto a la orden');
                return;
            }

            const orderData = {
                products: orderItems.map(item => ({
                    product_id: item.product_id,
                    quantity: item.quantity
                }))
            };

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('createOrderModal'));
                    modal.hide();
                    
                    orderItems = [];
                    orderTotal = 0;
                    updateOrderSummary();
                    
                    loadOrders();
                    loadProductsForOrder();
                } else {
                    alert('Error al crear la orden');
                }
            } catch (error) {
                console.error('Error creating order:', error);
                alert('Error al crear la orden');
            }
        }

        function renderOrders() {
            const grid = document.getElementById('ordersGrid');
            grid.innerHTML = '';

            orders.forEach(order => {
                const col = document.createElement('div');
                col.className = 'col-md-6 mb-3';
                
                col.innerHTML = `
                    <div class="card order-card h-100 shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="card-title">Orden #${order.id}</h5>
                                <span class="badge bg-success status-badge">
                                    Completada
                                </span>
                            </div>
                            <p class="card-text">
                                <strong>Cliente:</strong> ${order.user_name}<br>
                                <strong>Email:</strong> ${order.user_email}<br>
                                <strong>Fecha:</strong> ${new Date(order.created_at).toLocaleDateString()}
                            </p>
                            
                            <h6 class="mt-3">Productos:</h6>
                            <div class="product-list">
                                ${order.items.map(item => `
                                    <div class="d-flex justify-content-between small">
                                        <span>${item.name || `Producto ${item.product_id}`}</span>
                                        <span>${item.quantity} x $${item.price}</span>
                                    </div>
                                `).join('')}
                            </div>
                            
                            <hr>
                            <div class="d-flex justify-content-between align-items-center">
                                <h4 class="text-primary mb-0">$${order.total}</h4>
                                <div>
                                    <button class="btn btn-sm btn-danger" onclick="deleteOrder(${order.id})">
                                        <i class="fas fa-trash me-1"></i>Eliminar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
        }

        async function deleteOrder(id) {
            if (confirm('¿Estás seguro de que quieres eliminar esta orden?')) {
                try {
                    const response = await fetch(`/api/orders/${id}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        loadOrders();
                    }
                } catch (error) {
                    console.error('Error deleting order:', error);
                }
            }
        }
    </script>
</body>
</html>
